[package]
name = "microcode-security-regressions"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
